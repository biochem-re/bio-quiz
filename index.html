<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">生物クイズ</div>
  <div class="meta" id="meta"></div>
</header>

<main>
  <!-- スタート -->
  <section id="start" class="card">
    <h1>生物クイズ</h1>
    <p class="lead">全10問・1問ずつ答え合わせ。正解するとレベルが上がります。</p>
    <ol class="tiers" id="tierList"></ol>
    <div class="startBtns">
      <button class="btn primary" data-start="0">初級者レベルからスタート</button>
      <button class="btn" data-start="3">塾高生レベルからスタート</button>
    </div>
    <p class="note" id="best"></p>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="card" hidden>
    <div class="progress"><div id="progBar"></div></div>
    <div class="qhead">
      <span id="qnum"></span>
      <span class="badge" id="qlevel"></span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <p class="exp" id="exp"></p>
      <p class="levelMsg" id="levelMsg"></p>
      <button class="btn primary" id="next">次の問題へ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="card" hidden>
    <h1>結果</h1>
    <div class="score"><span id="score"></span><small> / 10問正解</small></div>
    <p class="reached" id="reached"></p>
    <ol class="review" id="review"></ol>
    <div class="startBtns">
      <button class="btn primary" id="again">もう一度挑戦する</button>
    </div>
  </section>
</main>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
